# nfsu2save — everything the browser needs is static; the container never
# receives a save. Uploads, parsing and downloads all happen client-side.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # Four files, no content hashes in their names: revalidate everything so a
    # redeploy can never pair a fresh index.html with a stale app.js.
    expires -1;

    # Keep every add_header at server level. A location that declares its own
    # add_header would drop all of these for that path; `expires` is unaffected.
    add_header Content-Security-Policy "default-src 'self' blob:; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
